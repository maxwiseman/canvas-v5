name: Extension release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: extension-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and upload browser extensions
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Read extension version from tag
        shell: bash
        run: |
          extension_version="${RELEASE_TAG#v}"
          if [[ ! "$extension_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or 1.2.3 (an optional fourth number is supported)."
            exit 1
          fi
          echo "EXTENSION_VERSION=$extension_version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check extension
        run: bun --filter extension compile

      - name: Package Chrome extension
        run: bun --filter extension zip

      - name: Package Firefox extension and sources
        run: bun --filter extension zip:firefox

      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "apps/extension/.output/extension-${EXTENSION_VERSION}-chrome.zip" \
            "apps/extension/.output/extension-${EXTENSION_VERSION}-firefox.zip" \
            "apps/extension/.output/extension-${EXTENSION_VERSION}-sources.zip" \
            --clobber
